  <style>
    :root { --ink:#17324d; --blue:#2878b5; --pale:#eef7fc; --line:#cbdde9; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif; background:#f6fafc; }
    main { max-width:1100px; margin:auto; padding:24px 16px 40px; }
    h1 { margin:0 0 6px; font-size:clamp(24px,4vw,38px); }
    .lead { margin:0 0 18px; color:#466276; }
    .panel { background:white; border:1px solid var(--line); border-radius:14px; padding:14px; box-shadow:0 5px 18px #17324d0d; }
    .controls { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; margin-bottom:12px; }
    .group { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
    .label { font-weight:700; margin-right:2px; }
    button { border:1px solid #9fc5da; border-radius:999px; padding:8px 13px; background:white; color:var(--ink); cursor:pointer; font-size:14px; }
    button:hover, button.active { background:var(--blue); color:white; border-color:var(--blue); }
    #status { margin:8px 0; color:#557184; font-size:14px; min-height:20px; }
    svg { display:block; width:100%; height:auto; min-height:360px; background:linear-gradient(#e9f6ff,#f8fcff); border-radius:10px; cursor:grab; touch-action:none; }
    svg.dragging { cursor:grabbing; }
    .country { fill:#f4c95d; stroke:#ffffff; stroke-width:.45px; cursor:pointer; }
    .country:hover { fill:#ee9752; }
    .graticule { fill:none; stroke:#9bc5d8; stroke-width:.35px; opacity:.75; }
    .info { margin-top:12px; padding:12px 14px; background:var(--pale); border-radius:10px; line-height:1.65; }
    .info strong { color:#0d6297; }
    .note { margin:12px 0 0; font-size:12px; color:#607887; }
    @media (max-width:650px) { svg { min-height:280px; } .controls { display:block; } .group { margin:8px 0; } }
  </style>

<script>
  const width = 960, height = 520;
  const svg = d3.select("#map");
  const path = d3.geoPath();
  const graticule = d3.geoGraticule10();
  let worldData;
  let region = "world";
  let projectionName = "mercator";
  let dragOffset = 0; // マウスドラッグによる東西方向の回転量（度）

  const descriptions = {
    mercator: ["メルカトル図法", "方角を保ちやすい図法。高緯度の地域ほど大きく見えます。"],
    azimuthal: ["正距方位図法", "中心からの距離と方角を表しやすい図法。中心から離れるほど形がゆがみます。"],
    mollweide: ["モルワイデ図法", "面積を正しく比べやすい図法。大陸の形にはゆがみがあります。"],
    equalEarth: ["イコールアース図法", "面積を保ちながら、世界全体を比較的自然に見せる図法です。"]
  };

  // 各「表示」の中心。地域を選んでもズームせず、世界全体を表示したまま
  // 選択した地域が地図の中央に来るよう、投影の中心だけを移動する。
  // [経度, 緯度] の順。
  const regionCenters = {
    world: [0, 0],
    netherlands: [5.3, 52.1],
    japan: [138, 36],
    usa: [-98, 39]
  };

  const regionLabels = {
    world: "世界",
    netherlands: "オランダ周辺",
    japan: "日本周辺",
    usa: "アメリカ周辺"
  };

  function makeProjection() {
    const center = regionCenters[region];
    // dragOffset を経度（東西方向）の回転量に加算し、マウスドラッグで
    // 東西に地図を動かせるようにする。緯度方向はドラッグでは動かさない。
    const rotation = [-center[0] + dragOffset, -center[1]];
    // メルカトル図法では緯度方向を動かさず、経度方向だけを移動する。
    // その他の図法では、選択地域が中央に来るよう経度・緯度の両方を移動する。
    const mercatorRotation = [-center[0] + dragOffset, 0];

    const p = {
      mercator: () => d3.geoMercator().rotate(mercatorRotation),
      azimuthal: () => d3.geoAzimuthalEquidistant().rotate(rotation),
      mollweide: () => d3.geoMollweide().rotate(rotation),
      equalEarth: () => d3.geoEqualEarth().rotate(rotation)
    }[projectionName]();

    // 常に世界全体に fit する。これにより地域を選んでも縮尺は変わらず、
    // 「世界地図の中心だけを選択地域へ移動する」動作になる。
    p.fitExtent([[18,18],[width-18,height-18]], worldData);
    return p;
  }

  function draw(animate = true) {
    if (!worldData) return;
    const p = makeProjection();
    path.projection(p);
    const t = animate ? svg.transition().duration(850) : svg;
    t.selectAll(".graticule").attr("d", path(graticule));
    t.selectAll(".country").attr("d", path);
    document.querySelector("#info").innerHTML = `<strong>${descriptions[projectionName][0]}</strong><br>${descriptions[projectionName][1]}`;
    document.querySelector("#status").textContent = `${regionLabels[region]}：国をクリックすると国名が表示されます。`;
  }

  function activate(selector, value) {
    document.querySelectorAll(selector).forEach(b => b.classList.toggle("active", b.dataset[selector.includes("region") ? "region" : "projection"] === value));
  }

  document.querySelectorAll("[data-region]").forEach(btn => btn.addEventListener("click", () => {
    region = btn.dataset.region; dragOffset = 0; activate("[data-region]", region); draw();
  }));
  document.querySelectorAll("[data-projection]").forEach(btn => btn.addEventListener("click", () => {
    projectionName = btn.dataset.projection; activate("[data-projection]", projectionName); draw();
  }));

  // マウス（およびタッチ）操作で地図を東西方向にドラッグ移動できるようにする。
  let dragStartX = 0;
  let dragStartOffset = 0;
  const dragBehavior = d3.drag()
    .on("start", (event) => {
      dragStartX = event.x;
      dragStartOffset = dragOffset;
      svg.classed("dragging", true);
    })
    .on("drag", (event) => {
      const dx = event.x - dragStartX;
      // 画面の横幅いっぱいのドラッグでおよそ180度回転する程度の感度。
      const sensitivity = 180 / width;
      dragOffset = dragStartOffset + dx * sensitivity;
      draw(false);
    })
    .on("end", () => {
      svg.classed("dragging", false);
    });
